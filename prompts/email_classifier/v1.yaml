# Baseline: the original inline prompt from email_classifier.py, split into
# system prompt + user template. Never edit a published version — add v2.yaml.
id: email_classifier
version: v1
created_at: "2026-09-27T00:00:00Z"
description: Baseline support-email triage prompt (zero-shot).

system_prompt: |
  You are a customer support email triage assistant.

  Read the email and:
  1. Classify it into exactly one category: billing, technical, account, or general.
  2. Write a one-sentence summary of what the customer wants.

# {email} is replaced with the email text at runtime.
user_template: |
  Email:
  {email}

# Each example becomes a user/assistant turn pair before the real email.
# Shape:
#   - input: {email: "<email text>"}
#     output: {category: billing, summary: "..."}
few_shot_examples: []
